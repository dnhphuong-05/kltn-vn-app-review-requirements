# FROZEN — khóa ngày 01/11/2026, amendment v2.5 (pre-register TRƯỚC khi tính trạng thái của cụm). Mọi thay đổi phải có amendment mới.
# Temporal Issue Validation (ĐC §7.5): luật, cửa sổ và tham số độ nhạy.
temporal:
  t0: '2026-10-06 23:59:59'
  timezone: Asia/Ho_Chi_Minh
  window_days: 30
  n_windows: 12                  # W0 = 30 ngày cuối trước T0 ... W11; N tính trên W0–W11 (360 ngày)
  b90: 0.2742                    # tỷ lệ review actionable của toàn corpus trong 90 ngày cuối (EDA 01/11/2026); notebook tính lại và đối chiếu
  rule:
    min_n: 20                    # N < 20 → INSUFFICIENT_EVIDENCE
    min_c30: 5                   # bằng chứng gần đây: c30 ≥ 5 ...
    min_r90: 0.5                 # ... và R90 = (c90 / N) / b90 ≥ 0,5; R90 < 0,5 → POSSIBLY_RESOLVED
    presence_min_reviews: 3      # một cửa sổ "có issue" khi group có ≥ 3 review trong cửa sổ đó
    recurring_min_windows: 6     # RECURRING khi có bằng chứng gần đây và n_win ≥ 6
  statuses_for_generation: [ACTIVE, RECURRING]
  version_evidence: report_only  # app_version thiếu 30,8%, 231 phiên bản — không dùng trong luật
  groups:
    topics: all_non_outlier
    mixed_subgroups: mixed_origin_types   # cụm mixed: thêm nhóm con (cụm × loại) theo Q14
  sensitivity:                   # đổi từng tham số một, chỉ báo cáo
    min_c30: [3, 10]
    min_r90: [0.4, 0.6]
    recurring_min_windows: [4, 8]
