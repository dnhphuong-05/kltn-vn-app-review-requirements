    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Times New Roman'; text-anchor: middle; fill: #ffffff" x="115.2" y="42.57275" transform="rotate(-0 115.2 42.57275)">1. Xác định vấn đề</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(65.51875 80.740338)">Review Google Play tiếng Việt</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(79.47 90.878512)">khối lượng lớn, nhiễu;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(60.65875 101.016687)">rút requirement thủ công tốn công</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(80.094375 111.154862)">và khó truy vết nguồn</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(115.2 119.436012)"/>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(99.24875 127.702162)">Chương 1</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Times New Roman'; text-anchor: middle; fill: #ffffff" x="316.8" y="41.716125" transform="rotate(-0 316.8 41.716125)">2. Mục tiêu giải pháp</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(265.75 84.888412)">RQ1: chọn chiến lược phân loại</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(290.699375 95.011587)">cân nhắc chi phí</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(274.3575 103.277738)">RQ2: nhóm issue có nghĩa</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(264.0375 113.415912)">RQ3: requirement đúng cấu trúc,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(272.128125 123.554087)">truy vết được · Chương 1–2</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Times New Roman'; text-anchor: middle; fill: #ffffff" x="518.4" y="42.579625" transform="rotate(-0 518.4 42.579625)">3. Thiết kế &amp; phát triển</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(478.081875 85.809425)">Pipeline cascade hai tầng</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(475.7625 95.9476)">+ quy tắc chọn chiến lược;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(482.226875 104.22875)">BERTopic + temporal;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(473.18875 114.351925)">sinh requirement bằng LLM</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(479.561875 122.633075)">Chương 3 · GĐ1–GĐ14</text>
   </g>
   <g id="text_8">
